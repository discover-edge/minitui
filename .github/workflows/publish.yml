name: Publish NuGet Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # nuget.org trusted publishing

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "VERSION_ARG=-p:Version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      - name: Restore dependencies
        run: dotnet restore src/MiniTui.sln

      - name: Build
        run: dotnet build src/MiniTui.sln --configuration Release --no-restore -warnaserror $VERSION_ARG

      - name: Test
        run: dotnet test src/MiniTui.sln --configuration Release --no-build

      - name: Pack
        run: dotnet pack src/MiniTui/MiniTui.csproj --configuration Release --no-build --output ./nupkg $VERSION_ARG

      - name: Push to GitHub Packages
        run: dotnet nuget push ./nupkg/*.nupkg --source "https://nuget.pkg.github.com/discover-edge/index.json" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate

      # nuget.org (Open Question 1) via trusted publishing: the login step trades the workflow's OIDC token for a
      # short-lived API key. Skipped until the repository has a NUGET_USER variable (the nuget.org account that
      # owns the trusted publishing policy for this repository and publish.yml).
      - name: Log in to nuget.org
        id: nuget-login
        if: vars.NUGET_USER != ''
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        if: vars.NUGET_USER != ''
        run: dotnet nuget push ./nupkg/*.nupkg --source https://api.nuget.org/v3/index.json --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --skip-duplicate
