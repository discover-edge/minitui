name: Publish NuGet Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "VERSION_ARG=-p:Version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      - name: Restore dependencies
        run: dotnet restore src/MiniTui.sln

      - name: Build
        run: dotnet build src/MiniTui.sln --configuration Release --no-restore -warnaserror $VERSION_ARG

      - name: Test
        run: dotnet test src/MiniTui.sln --configuration Release --no-build

      - name: Pack
        run: dotnet pack src/MiniTui/MiniTui.csproj --configuration Release --no-build --output ./nupkg $VERSION_ARG

      - name: Push to GitHub Packages
        run: dotnet nuget push ./nupkg/*.nupkg --source "https://nuget.pkg.github.com/discover-edge/index.json" --api-key ${{ secrets.GITHUB_TOKEN }}
